name: Auto-update profile.json

on:
  schedule:
    - cron: "0 */24 * * *"    # every 6 hours (adjust if desired)
  workflow_dispatch:         # allows manual trigger

permissions:
  contents: write            # allow committing to repo

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make public dir
        run: mkdir -p public

      - name: Fetch GitHub profile via GraphQL
        env:
            GH_USERNAME: sachi-20
            GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
            mkdir -p public

            QUERY='query($login: String!) {
                user(login: $login) {
                    name
                    bio
                    avatarUrl
                    location
                    pinnedItems(first: 3) {
                        totalCount
                        edges {
                            node {
                                name
                                description
                                forkCount
                                stargazers { totalCount }
                                url
                                id
                                diskUsage
                                primaryLanguage { name color }
                            }
                        }
                    }
                }
            }'

            # Encode query and variables into a single JSON line safely
            JSON_PAYLOAD=$(jq -n --arg q "$QUERY" --arg login "$GH_USERNAME" '{query: $q, variables: {login: $login}}')

            echo "Fetching GraphQL data for $GH_USERNAME"
            curl -s -X POST https://api.github.com/graphql \
                -H "Authorization: bearer $GH_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$JSON_PAYLOAD" \
                -o public/profile.json

            echo "GraphQL response (first 20 lines):"
            head -n 20 public/profile.json

            # Validate output
            if ! grep -q '"data"' public/profile.json; then
                echo "❌ ERROR: Invalid GraphQL response (no 'data' field)"
                cat public/profile.json
                exit 1
            fi

      - name: Show small preview (for logs)
        run: |
          echo "Top of public/profile.json:"
          head -n 30 public/profile.json || true

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # optional if you use default token; not required if using GH_TOKEN for GraphQL
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Auto-update profile.json via GitHub Actions" || echo "No changes to commit"
          git push
