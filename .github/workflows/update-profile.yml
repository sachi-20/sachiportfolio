name: Auto-update profile.json

on:
  schedule:
    - cron: "0 */24 * * *"    # every 6 hours (adjust if desired)
  workflow_dispatch:         # allows manual trigger

permissions:
  contents: write            # allow committing to repo

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make public dir
        run: mkdir -p public

      - name: Fetch GitHub profile via GraphQL
        env:
          GH_USERNAME: sachi-20
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          # Build GraphQL payload that returns the same structure your app expects
          read -r -d '' PAYLOAD <<'GRAPHQL'
          {
            "query": "query($login: String!) { user(login: $login) { name bio avatarUrl location pinnedItems(first: 6) { totalCount edges { node { name description forkCount stargazers { totalCount } url id diskUsage primaryLanguage { name color } } } } } }",
            "variables": { "login": "sachi-20" }
          }
          GRAPHQL

          # Call GitHub GraphQL API and save raw output
          curl -s -H "Authorization: bearer $GH_TOKEN" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               https://api.github.com/graphql \
               -o public/profile.json

          # quick validation: ensure we have non-empty output and it contains "data"
          if ! jq -e '.data' public/profile.json > /dev/null 2>&1; then
            echo "ERROR: GraphQL response invalid or missing 'data' field"
            echo "--- BEGIN response ---"
            cat public/profile.json || true
            echo "---- END response ----"
            exit 1
          fi

      - name: Show small preview (for logs)
        run: |
          echo "Top of public/profile.json:"
          head -n 30 public/profile.json || true

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # optional if you use default token; not required if using GH_TOKEN for GraphQL
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Auto-update profile.json via GitHub Actions" || echo "No changes to commit"
          git push

